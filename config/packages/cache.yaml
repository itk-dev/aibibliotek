framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Dedicated pool for email-confirmation tokens. A registered
        # user holds a single short-lived token (24h) that grants the
        # one transition `AwaitingEmailConfirmation → Pending`. The
        # pool is separate from `cache.app` so future cache flushes
        # against the app pool don't invalidate live confirmation
        # tokens, and so the namespace is easy to scope.
        pools:
            cache.email_confirmation: null

# Tests get in-memory cache pools so cache consumers — `cache.app`,
# the rate-limiter pool, and the email-confirmation pool — start
# each kernel boot with a clean slate.
when@test:
    framework:
        cache:
            app: cache.adapter.array
            pools:
                cache.rate_limiter:
                    adapter: cache.adapter.array
                cache.email_confirmation:
                    adapter: cache.adapter.array
