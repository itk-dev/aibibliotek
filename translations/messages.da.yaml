# Default templates for the admin-editable transactional email
# settings. `SettingsManager` falls back to these keys when no
# row exists in the `setting` table. The `%token%` placeholders
# are intentionally NOT translator parameters — `EmailTemplateRenderer`
# substitutes them at send time with the recipient-specific values.
settings:
    admin:
        notification_subject: "Ny bruger venter godkendelse — %brand_name%"
        notification_body: |
            En ny bruger har netop oprettet sig:

            - **Navn:** %name%
            - **E-mail:** %email%

            Brugeren afventer godkendelse. Gennemse køen på
            [%approval_url%](%approval_url%).
    registration:
        confirmation_subject: "Velkommen til %brand_name%"
        confirmation_body: |
            Hej %name%,

            Tak for din oprettelse på %brand_name%. Vi har modtaget din
            forespørgsel og en administrator vil godkende kontoen,
            før du kan logge ind.

            Du modtager besked, så snart kontoen er klar.
    email_confirmation:
        subject: "Bekræft din e-mail – %brand_name%"
        body: |
            Hej %name%,

            Du modtager denne e-mail, fordi der er oprettet en bruger
            med denne adresse hos %brand_name%. Klik på linket for at
            bekræfte, at du ejer adressen. Først derefter kan en
            administrator godkende din konto.

            [Bekræft min e-mail](%confirmation_url%)

            Linket virker i 24 timer og kan kun bruges én gang.
    password_reset:
        subject: "Nulstil dit password – %brand_name%"
        body: |
            Hej %name%,

            Du modtager denne e-mail, fordi der er anmodet om at
            nulstille passwordet for din konto hos %brand_name%. Klik
            på linket for at vælge et nyt password:

            [Vælg nyt password](%reset_url%)

            Linket udløber om %expires_in% og kan kun bruges én gang.
            Hvis det ikke var dig, kan du ignorere denne e-mail —
            passwordet ændres først, når linket klikkes.

